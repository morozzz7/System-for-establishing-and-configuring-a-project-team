# Production compose: published images only, no bind mounts and no host ports
# except the gateway. Deployed by .github/workflows/deploy.yml into DEPLOY_PATH.
#
#   project directory = <DEPLOY_PATH>/prod
#   env file          = <DEPLOY_PATH>/.env  (pass --env-file ../.env or from DEPLOY_PATH)
#   nginx config      = <DEPLOY_PATH>/nginx/nginx.conf

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teamopt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-teamopt}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teamopt} -d ${POSTGRES_DB:-teamopt}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/teamopt-backend:${IMAGE_TAG:-latest}
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml:8000}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}
      AUTH_TOKEN_TTL_MINUTES: ${AUTH_TOKEN_TTL_MINUTES:-60}
      AUTH_USERS: ${AUTH_USERS:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/api", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  ml:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/teamopt-ml:${IMAGE_TAG:-latest}
    restart: always
    env_file:
      - path: ../.env
        required: false
      - path: ../ml.env
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/teamopt-frontend:${IMAGE_TAG:-latest}
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  gateway:
    image: nginx:1.27-alpine
    restart: always
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${GATEWAY_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
      ml:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  pgdata:

# Competency taxonomy seed, v1 (task 1.2).
# Single source of truth for roles, competencies (technology -> level 1..5) and RU/EN synonyms.
# Loaded into `role` / `competency` / `competency_synonym` by backend 2.1; ML normalization uses the
# same file for the closed vocabulary handed to /v1/extract (see contracts/ml-openapi.yaml).
#
# Rules
# - Every id is stable forever; renaming = add a synonym, never change the id.
# - Levels are 1..5 with the shared descriptors below; levels are a property of an employee,
#   not of a competency.
# - `roles` is many-to-many: a competency may belong to several roles.
# - Synonyms are used for exact matching before embeddings; they must be lowercase.
# - No personal data here: roles, technologies and generic skill descriptions only.
schema_version: 1.0.0
contract_version: v1
updated: '2026-11-05'
default_locale: ru
level_scale: 5

levels:
  - level: 1
    label_ru: Ознакомлен
    label_en: Awareness
    description_ru: Знает о существовании технологии, читал документацию, не применял в работе.
    description_en: Knows the technology exists, has read the docs, never used it in production.
  - level: 2
    label_ru: Базовый
    label_en: Basic
    description_ru: Выполняет типовые задачи по инструкции или с наставником.
    description_en: Performs routine tasks following instructions or with a mentor.
  - level: 3
    label_ru: Уверенный
    label_en: Proficient
    description_ru: Самостоятельно решает типовые задачи, знает типичные ошибки, может дежурить.
    description_en: Solves standard tasks independently, knows common pitfalls, can be on-call.
  - level: 4
    label_ru: Продвинутый
    label_en: Advanced
    description_ru: Проектирует решения, разбирает сложные инциденты, обучает коллег.
    description_en: Designs solutions, resolves complex incidents, mentors colleagues.
  - level: 5
    label_ru: Эксперт
    label_en: Expert
    description_ru: Владеет темой на уровне автора стандартов, определяет техническую политику.
    description_en: Sets standards and technical policy, recognized authority.


openapi: 3.1.0

info:
  title: Optimal Project Team Formation - Core API (UI <-> Go)
  version: 1.0.0
  summary: Decision-support API for team formation. Go is the system of record.
  description: |
    Contract between the React UI and the Go core service. Go owns all facts, all hard-constraint
    verification, duration math, deficits, metrics and explanations; the ML service only proposes
    (see `ml-openapi.yaml` and ADR-001).

    Conventions
    - Base path `/api/v1` (included in `servers`). A breaking change means a new major path
      (`/api/v2`), never an in-place edit.
    - Every mutating call accepts `X-Request-Id` and echoes it in the response header and in
      `Problem.request_id`. Retries with the same id are idempotent (Go dedupes on it).
    - All errors use `Problem` (RFC 9457 shape) plus machine-readable `reason_codes[]`.
      The UI localizes texts from codes; server `text` is already localized for `Accept-Language`.
    - Identifiers are pseudonyms (`emp_*`, `brf_*`, `run_*`, `var_*`, `req_*`, `prj_*`). No names,
      e-mails, phones, salaries or free-form personal notes exist anywhere in this contract.
      Cost is modeled as a dimensionless coefficient by grade (see ADR-002, `reference.yaml`).
    - Levels are integers 1..5. Effort is person-days. Weekly load is hours. The time grid is
      ISO-8601 weeks (`2026-W07`, Monday-based) - see ADR-002 and ADR-003.
    - Dates are `format: date`; timestamps are RFC 3339 in UTC.
    - Every number that the UI shows for a variant is recomputed by Go; the UI never trusts ML output.
  contact:
    name: Team Formation Architecture
  license:
    name: Proprietary

servers:
  - url: http://localhost:8080/api/v1
    description: Local docker-compose stack
  - url: https://teamopt.internal/api/v1
    description: Staging / pilot

security:
  - bearerAuth: []

tags:
  - name: Briefs
    description: Brief intake and extracted / human-reviewed requirements.
  - name: Runs
    description: Optimization runs, team variants, explanations, recalculation, decisions.
  - name: Employees
    description: Pseudonymized profiles, competency levels and weekly capacity.
  - name: Projects
    description: Existing projects, assignments and absences feeding availability.
  - name: Taxonomy
    description: Role / competency taxonomy and normalization helpers.
  - name: Reference
    description: Grades, cost coefficients, planning parameters and weight presets.
  - name: Health
    description: Liveness and readiness.

paths:
  /healthz:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Liveness probe (process only, no dependencies).
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: ok
                service: core-api
                version: 1.0.0
                uptime_s: 4212
  /readyz:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Readiness probe with dependency status (db, ml, taxonomy).
      responses:
        '200':
          description: All required dependencies are usable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessReport'
              example:
                ready: true
                dependencies:
                  - name: postgres
                    state: up
                    latency_ms: 3
                  - name: ml_service
                    state: degraded
                    latency_ms: 820
                    reason_codes: [ML_LLM_UNAVAILABLE]
                  - name: taxonomy
                    state: up
                degraded_capabilities: [brief_extraction]
        '503':
          description: At least one required dependency is down; capability matrix in the body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessReport'
              example:
                ready: false
                dependencies:
                  - name: postgres
                    state: up
                    latency_ms: 4
                  - name: ml_service
                    state: down
                    latency_ms: 0
                    reason_codes: [ML_TIMEOUT]
                  - name: taxonomy
                    state: up
                degraded_capabilities: [brief_extraction, optimization, normalization]

  /briefs:
    post:
      tags: [Briefs]
      operationId: createBrief
      summary: Upload a brief as text or file; extraction is started asynchronously.
      description: |
        Accepts raw text or an uploaded document (`.docx`, `.pdf`, `.txt`). The raw text is stored,
        personal data is stripped before any LLM call (see ADR-004). Returns `202` while extraction
        runs; poll `GET /briefs/{briefId}`.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BriefCreate'
            example:
              title: Portal migration to Go
              source_type: text
              language: ru
              text: |
                Нужно перевести личный кабинет на Go. Требуется 2 бэкенд-разработчика со знанием Go
                и PostgreSQL, один аналитик. Срок - 3 месяца, старт в январе.
              requested_start_week: '2026-W02'
              deadline_week: '2026-W14'
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Brief document (.docx/.pdf/.txt), max 10 MB.
                title:
                  type: string
                  maxLength: 200
                requested_start_week:
                  type: string
                  pattern: '^[0-9]{4}-W(0[1-9]|[1-4][0-9]|5[0-3])$'
      responses:
        '202':
          description: Brief stored; extraction queued.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brief'
              example:
                brief_id: brf_01HX7Q
                title: Portal migration to Go
                source_type: text
                language: ru
                status: extracting
                requested_start_week: '2026-W02'
                deadline_week: '2026-W14'
                created_at: '2026-11-05T09:14:00Z'
                requirement_count: 0
                needs_review_count: 0
                reason_codes: []
        '400':
          $ref: '#/components/responses/Problem400'
        '413':
          description: File too large (> 10 MB).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Unsupported media type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/Problem422'
        '503':
          $ref: '#/components/responses/Problem503'
    get:
      tags: [Briefs]
      operationId: listBriefs
      summary: List briefs (newest first).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/BriefStatus'
      responses:
        '200':
          description: Page of briefs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BriefPage'
              example:
                items:
                  - brief_id: brf_01HX7Q
                    title: Portal migration to Go
                    source_type: text
                    language: ru
                    status: extracted
                    requested_start_week: '2026-W02'
                    deadline_week: '2026-W14'
                    created_at: '2026-11-05T09:14:00Z'
                    requirement_count: 4
                    needs_review_count: 1
                    reason_codes: [REQ_LOW_CONFIDENCE]
                meta:
                  limit: 20
                  offset: 0
                  total: 1

  /briefs/{briefId}:
    parameters:
      - $ref: '#/components/parameters/BriefId'
    get:
      tags: [Briefs]
      operationId: getBrief
      summary: Get a brief with extraction status and diagnostics.
      responses:
        '200':
          description: The brief.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brief'
              example:
                brief_id: brf_01HX7Q
                title: Portal migration to Go
                source_type: text
                language: ru
                status: needs_review
                requested_start_week: '2026-W02'
                deadline_week: '2026-W14'
                created_at: '2026-11-05T09:14:00Z'
                requirement_count: 4
                needs_review_count: 1
                extraction:
                  model: qwen2.5-14b-instruct
                  prompt_version: extract-v3
                  duration_ms: 5400
                  json_valid: true
                  retries: 0
                reason_codes: [REQ_LOW_CONFIDENCE, REQ_EFFORT_WIDE_RANGE]
        '404':
          $ref: '#/components/responses/Problem404'

  /briefs/{briefId}/text:
    parameters:
      - $ref: '#/components/parameters/BriefId'
    get:
      tags: [Briefs]
      operationId: getBriefText
      summary: Stored brief text (source for evidence highlighting and faithfulness checks).
      description: |
        Evidence spans (`char_start`/`char_end`) index into exactly this string, so the UI can
        highlight claims and `qa-eval` can assert `text[start:end] == quote`. The text is the
        de-identified version that was sent to ML; the raw upload is not served. Access is audited.
      responses:
        '200':
          description: Brief text.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BriefText'
              example:
                brief_id: brf_01HX7Q
                language: ru
                sha256: 3f7c1d9e5b2a4c8f0d6e1a3b5c7d9e0f2a4b6c8d0e2f4a6b8c0d2e4f6a8b0c2d
                deidentified: true
                text: |
                  Нужно перевести личный кабинет на Go. Требуется 2 бэкенд-разработчика со знанием Go
                  и PostgreSQL, один аналитик. Срок - 3 месяца, старт в январе.
        '404':
          $ref: '#/components/responses/Problem404'

  /briefs/{briefId}/requirements:
    parameters:
      - $ref: '#/components/parameters/BriefId'
    get:
      tags: [Briefs]
      operationId: listRequirements
      summary: Extracted requirements with evidence spans and normalization candidates.
      description: |
        Every requirement carries at least one `evidence` item pointing into the brief text
        (`char_start`/`char_end`/`quote`). A requirement without evidence is never stored
        (contract-level rule: `evidence` has `minItems: 1`; see METRICS 3.1 hallucination rate 0%).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: needs_review
          in: query
          description: Filter by human-review flag.
          schema:
            type: boolean
        - name: criticality
          in: query
          schema:
            $ref: '#/components/schemas/Criticality'
      responses:
        '200':
          description: Requirements of the brief.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementPage'
              example:
                items:
                  - requirement_id: req_3d1c
                    brief_id: brf_01HX7Q
                    role:
                      role_id: backend_engineer
                      name_ru: Бэкенд-разработчик
                      confidence: 0.94
                    competency_id: lang_go
                    competency_name_ru: Go
                    level: 3
                    criticality: must
                    headcount: 2
                    effort:
                      min_person_days: 40
                      likely_person_days: 55
                      max_person_days: 80
                      unit: person_days
                    assumptions:
                      - Миграция сервисов без изменения схемы данных.
                      - Тестовое покрытие переносится вместе с кодом.
                    confidence: 0.86
                    needs_review: false
                    normalization:
                      top1_score: 0.97
                      candidates:
                        - competency_id: lang_go
                          name_ru: Go
                          score: 0.97
                        - competency_id: lang_java
                          name_ru: Java
                          score: 0.21
                    evidence:
                      - kind: brief_span
                        quote: 2 бэкенд-разработчика со знанием Go
                meta:
                  limit: 50
                  offset: 0
                  total: 4

  /briefs/{briefId}/requirements/{requirementId}:
    parameters:
      - $ref: '#/components/parameters/BriefId'
      - $ref: '#/components/parameters/RequirementId'
    patch:
      tags: [Briefs]
      operationId: patchRequirement
      summary: Human review edit of one requirement (level, criticality, effort, competency).
      description: |
        Any edit is audited (`audit_log`, actor pseudonym). Editing `level` or `effort` re-runs
        normalization confidence checks but never re-runs the LLM.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementPatch'
            example:
              level: 4
              criticality: must
              effort:
                min_person_days: 45
                likely_person_days: 60
                max_person_days: 90
                unit: person_days
              comment: Уровень поднят по итогам созвона с заказчиком.
      responses:
        '200':
          description: Updated requirement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Requirement'
              example:
                requirement_id: req_3d1c
                brief_id: brf_01HX7Q
                role:
                  role_id: backend_engineer
                  name_ru: Бэкенд-разработчик
                  confidence: 0.94
                competency_id: lang_go
                competency_name_ru: Go
                level: 4
                criticality: must
                headcount: 2
                effort:
                  min_person_days: 45
                  likely_person_days: 60
                  max_person_days: 90
                  unit: person_days
                assumptions:
                  - Миграция сервисов без изменения схемы данных.
                confidence: 1.0
                needs_review: false
                normalization:
                  top1_score: 0.97
                  candidates:
                    - competency_id: lang_go
                      name_ru: Go
                      score: 0.97
                evidence:
                  - kind: brief_span
                    quote: 2 бэкенд-разработчика со знанием Go
                review:
                  edited: true
                  edited_by: emp_7fa2
                  edited_at: '2026-11-05T10:02:00Z'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          description: Brief is not in a reviewable state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://teamopt.internal/problems/brief-state
                title: Brief is not reviewable
                status: 409
                code: CONFLICT_BRIEF_STATE
                detail: Requirement cannot be edited while the brief status is 'extracting'.
                request_id: req_01HX80
                reason_codes: [BRIEF_STATE_CONFLICT]
        '422':
          $ref: '#/components/responses/Problem422'

  /briefs/{briefId}/requirements:confirm:
    parameters:
      - $ref: '#/components/parameters/BriefId'
    post:
      tags: [Briefs]
      operationId: confirmRequirements
      summary: Confirm the reviewed requirement set; unlocks optimization runs.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                requirement_ids:
                  type: array
                  description: Subset to confirm; omitted = all requirements.
                  items:
                    type: string
            example:
              requirement_ids: [req_3d1c, req_88ab, req_1120, req_4c5d]
      responses:
        '200':
          description: Brief moved to `confirmed`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brief'
              example:
                brief_id: brf_01HX7Q
                title: Portal migration to Go
                source_type: text
                language: ru
                status: confirmed
                requested_start_week: '2026-W02'
                deadline_week: '2026-W14'
                created_at: '2026-11-05T09:14:00Z'
                requirement_count: 4
                needs_review_count: 0
                reason_codes: []
        '409':
          description: Unresolved review items remain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://teamopt.internal/problems/unresolved-review
                title: Unresolved review items
                status: 409
                code: CONFLICT_UNRESOLVED_REVIEW
                detail: 1 requirement still needs human review.
                request_id: req_01HX81
                reason_codes: [REQ_NEEDS_REVIEW]
        '422':
          $ref: '#/components/responses/Problem422'

  /runs:
    post:
      tags: [Runs]
      operationId: createRun
      summary: Start an optimization run for a confirmed brief.
      description: |
        Go snapshots requirements, candidate profiles and the weekly capacity matrix, then calls ML
        `/v1/optimize`. The returned `run` is `queued`/`running`; poll `GET /runs/{runId}`.
        ML results are advisory: every variant is re-validated (G1-G5) and re-measured by Go.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
            example:
              brief_id: brf_01HX7Q
              preset: balanced
              k: 3
              seed: 42
              time_limit_ms: 10000
              horizon:
                start_week: '2026-W02'
                end_week: '2026-W16'
              candidate_filter:
                include_bench: true
                include_external: false
                max_candidates: 500
      responses:
        '202':
          description: Run accepted and queued.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Location:
              description: URL of the created run.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamRun'
              example:
                run_id: run_9b2e
                brief_id: brf_01HX7Q
                status: queued
                preset: balanced
                k: 3
                seed: 42
                time_limit_ms: 10000
                horizon:
                  start_week: '2026-W02'
                  end_week: '2026-W16'
                created_at: '2026-11-05T10:12:00Z'
                variants: []
                reason_codes: []
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          description: Brief is not confirmed yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://teamopt.internal/problems/brief-state
                title: Brief is not confirmed
                status: 409
                code: CONFLICT_BRIEF_STATE
                detail: Confirm requirements before starting a run.
                request_id: req_01HX90
                reason_codes: [BRIEF_NOT_CONFIRMED]
        '422':
          $ref: '#/components/responses/Problem422'
        '503':
          $ref: '#/components/responses/Problem503'

  /runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Runs]
      operationId: getRun
      summary: Run status, diagnostics and (when finished) the variant set.
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamRun'
              example:
                run_id: run_9b2e
                brief_id: brf_01HX7Q
                status: succeeded
                preset: balanced
                k: 3
                seed: 42
                time_limit_ms: 10000
                horizon:
                  start_week: '2026-W02'
                  end_week: '2026-W16'
                created_at: '2026-11-05T10:12:00Z'
                finished_at: '2026-11-05T10:12:09Z'
                diagnostics:
                  solver_status: FEASIBLE
                  solve_time_ms: 6410
                  ml_status: ok
                  ml_attempts: 1
                  validator_rejected: 0
                  fallback_used: false
                  metrics_version: m1-m12@2026-10
                  contract_version: v1
                variants:
                  - variant_id: var_a1
                    label: Balanced / fastest
                    gate_pass: true
                    score: 0.803
                    team_size: 4
                    duration:
                      p50_weeks: 11.4
                      p80_weeks: 13.9
                      p50_working_days: 57
                      p80_working_days: 70
                      slack_weeks: -0.07
                    cost_units: 2132.0
                    metric_values:
                      M1: 0.93
                      M2: 0.88
                      M3: 0.81
                      M5: 0.64
                      M6: 0.71
                      M7: 0.86
                      M8: 0.92
                      M9: 0.75
                      M10: 0.9
                      M11: 0.35
                      M12: 0.7
                      score: 0.803
                    deficit_count: 1
                    reason_codes: [VARIANT_FASTEST]
                reason_codes: []
        '404':
          $ref: '#/components/responses/Problem404'

  /runs/{runId}/variants:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
    get:
      tags: [Runs]
      operationId: listVariants
      summary: Compare variants (metric vectors, duration, deficits).
      responses:
        '200':
          description: Variants of the run, best score first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariantPage'
              example:
                items:
                  - variant_id: var_a1
                    label: Balanced / fastest
                    gate_pass: true
                    score: 0.803
                    team_size: 4
                    duration:
                      p50_weeks: 11.4
                      p80_weeks: 13.9
                      p50_working_days: 57
                      p80_working_days: 70
                      slack_weeks: -0.07
                    cost_units: 2132.0
                    metric_values:
                      M1: 0.93
                      M2: 0.88
                      M3: 0.81
                      M5: 0.64
                      M6: 0.71
                      M7: 0.86
                      M8: 0.92
                      M9: 0.75
                      M10: 0.9
                      M11: 0.35
                      M12: 0.7
                      score: 0.803
                    deficit_count: 1
                    reason_codes: [VARIANT_FASTEST]
                meta:
                  limit: 20
                  offset: 0
                  total: 3

  /runs/{runId}/variants/{variantId}:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/VariantId'
    get:
      tags: [Runs]
      operationId: getVariant
      summary: Full variant detail - members, weekly assignments, metric breakdown, deficits.
      responses:
        '200':
          description: Variant detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Variant'
              example:
                variant_id: var_a1
                run_id: run_9b2e
                label: Balanced / fastest
                gate_pass: true
                gate_violations:
                  G1: 0
                  G2: 0
                  G3: 0
                  G4: 0
                  G5: 0
                score: 0.803
                team_size: 4
                cost_units: 2132.0
                duration:
                  p50_weeks: 11.4
                  p80_weeks: 13.9
                  p50_working_days: 57
                  p80_working_days: 70
                  slack_weeks: -0.07
                  deadline_week: '2026-W14'
                  p_on_time: 0.64
                  monte_carlo:
                    runs: 2000
                    seed: 42
                metric_values:
                  M1: 0.93
                  M2: 0.88
                  M3: 0.81
                  M5: 0.64
                  M6: 0.71
                  M7: 0.86
                  M8: 0.92
                  M9: 0.75
                  M10: 0.9
                  M11: 0.35
                  M12: 0.7
                  score: 0.803
                metric_details:

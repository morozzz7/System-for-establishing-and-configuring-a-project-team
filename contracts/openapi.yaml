  /runs/{runId}/variants/{variantId}/explanation:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/VariantId'
      - $ref: '#/components/parameters/AcceptLanguage'
    get:
      tags: [Runs]
      operationId: getVariantExplanation
      summary: Why each member is in, why relevant people are out, main trade-off (reason codes + texts).
      description: |
        Every statement is derived from structured facts (assignment rows, capacity rows, metric
        values, constraint overrides). `factors[].reason_code` is mandatory; `text` is rendered
        from the reason code and `facts` only. Faithfulness target 100% (METRICS 3.5).
      responses:
        '200':
          description: Explanation bundle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Explanation'
              example:
                variant_id: var_a1
                run_id: run_9b2e
                locale: ru
                headline: Быстрый вариант: P50 11.4 недели, но P80 на 0.9 недели выходит за дедлайн (P(в срок) = 0.64), и есть дефицит по Go.
                tradeoff:
                  text: Скорость куплена ценой 12 человеко-дней дефицита по Go и 2 затронутых проектов.
                  reason_codes: [TRADEOFF_SPEED_VS_DEFICIT]
                  facts:
                    p50_weeks: 11.4
                    deficit_person_days: 12
                    projects_affected: 2
                included:
                  - employee_id: emp_7fa2
                    text: Уровень Go 4 при требуемом 3, свободная ёмкость 32 ч/нед в неделях 02-14.
                    reason_codes: [INCLUDE_HIGH_COMPETENCE, INCLUDE_AVAILABLE_CAPACITY]
                    facts:
                      competency_id: lang_go
                      level: 4
                      required_level: 3
                      free_hours_week: 32
                excluded:
                  - employee_id: emp_e19c
                    text: Исключён - загрузка 118% в неделе 05 и отпуск в неделях 05-06.
                    reason_codes: [EXCLUDE_OVERLOADED, EXCLUDE_ABSENT]
                    facts:
                      overload_pct: 118
                      absent_weeks: ['2026-W05', '2026-W06']
                deficits:
                  - competency_id: lang_go
                    text: Не хватает 12 человеко-дней до полного покрытия must-требования.
                    reason_codes: [DEFICIT_MUST_ROLE]
                    facts:
                      required_person_days: 60
                      covered_person_days: 48
                counterfactuals:
                  - text: Если снять ограничение "не более 5 человек", P50 снизится примерно на 0.8 недели.
                    reason_codes: [COUNTERFACTUAL_TEAM_SIZE]
                    verified_by: rerun
                    run_id: run_9b2f
        '404':
          $ref: '#/components/responses/Problem404'

  /runs/{runId}/recalculate:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Runs]
      operationId: recalculateRun
      summary: Apply manual constraint overrides and recompute the variant set.
      description: |
        Creates a new run derived from `runId` (the old run stays immutable, both are linked in
        `audit_log`). Metamorphic expectation (METRICS 3.6): a changed constraint must change the
        result accordingly, or the response carries an explicit `no_effect` reason code with facts.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecalculateRequest'
            example:
              base_variant_id: var_a1
              preset: balanced
              k: 2
              seed: 42
              time_limit_ms: 5000
              overrides:
                - type: force_include
                  employee_id: emp_b31d
                  reason: Нужен опыт миграции.
                - type: force_exclude
                  employee_id: emp_d02f
                  reason: Уходит на другой проект.
                - type: max_team_size
                  value: 4
                  reason: Ограничение ресурсного менеджера.
                - type: deadline
                  week: '2026-W12'
                  reason: Перенос срока заказчиком.
      responses:
        '202':
          description: Recalculation queued; new run id in the body.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecalculateResponse'
              example:
                run_id: run_9b30
                parent_run_id: run_9b2e
                status: queued
                applied_overrides: 4
                rejected_overrides: []
                reason_codes: [RECALC_QUEUED]
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          description: Overrides contradict hard constraints (e.g. force-include an unavailable person).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://teamopt.internal/problems/override-infeasible
                title: Override contradicts a hard constraint
                status: 409
                code: CONFLICT_OVERRIDE_INFEASIBLE
                detail: emp_e19c is absent in 2026-W05..W06 and cannot be force-included.
                request_id: req_01HXa1
                reason_codes: [OVERRIDE_VIOLATES_G1]
                errors:
                  - field: overrides[0].employee_id
                    code: OVERRIDE_VIOLATES_G1
                    detail: employee is unavailable in the planning horizon
        '422':
          $ref: '#/components/responses/Problem422'

  /runs/{runId}/decision:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Runs]
      operationId: recordDecision
      summary: Record the human decision (human-in-the-loop; never automated).

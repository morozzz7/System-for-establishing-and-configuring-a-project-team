                  concurrent_projects_mean: 1.6
                  n_opt: 4
                  bench_hours_assigned: 96
                  resilience_score: 0.7
                members:
                  - employee_id: emp_7fa2
                    role_id: backend_engineer
                    grade: S
                    allocated_hours: 480
                    assignment_share: 0.85
                    competence_fit: 1.0
                    reason_codes: [INCLUDE_HIGH_COMPETENCE, INCLUDE_AVAILABLE_CAPACITY]
                    explanation_id: exp_5b1a
                  - employee_id: emp_b31d
                    role_id: backend_engineer
                    grade: M
                    allocated_hours: 360
